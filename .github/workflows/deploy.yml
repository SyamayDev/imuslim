# Setiap push ke main: lint → tes → build → publikasikan dist/ ke branch gh-pages.
# GitHub Pages lalu menayangkan branch itu di https://syamaydev.github.io/imuslim/.
# Prasyarat satu kali: Settings → Pages → Build and deployment →
#   Source: "Deploy from a branch", Branch: gh-pages, folder: / (root).
# Vercel membangun sendiri dari branch main (lihat vercel.json), tidak lewat workflow ini.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Lint, tes, build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependensi
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tes unit & komponen
        run: npm test

      - name: Build produksi (base /imuslim/, 511 halaman prerender)
        run: npm run build

      - name: Siapkan isi branch gh-pages
        run: node scripts/gh-pages-prepare.mjs

      - name: Publikasikan ke branch gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: 'deploy: ${{ github.sha }}'
