      name="description"
      content="iMuslim: Al-Qur'an digital dengan audio, jadwal sholat & imsakiyah, doa, hadits, kalender Hijriah, arah kiblat, dan kalkulator zakat dalam satu aplikasi web yang ringan."
    />
    <meta name="theme-color" content="#F6F2E9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1613" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="iMuslim" />
    <meta name="apple-mobile-web-app-title" content="iMuslim" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="__SITE_URL__/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="iMuslim" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="iMuslim — Teman Ibadah Harian" />
    <meta
      property="og:description"
      content="Al-Qur'an, jadwal sholat, doa, hadits, kalender Hijriah, kiblat, dan zakat dalam satu aplikasi web."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo iMuslim: lengkung mihrab, bulan sabit, dan buku terbuka" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <script>
      // Terapkan tema sebelum render pertama agar tidak berkedip.
      (function () {
        var theme = 'system';
        try {
          var raw = localStorage.getItem('imuslim:prefs');
          if (raw) {
            var p = JSON.parse(raw);
            if (p && (p.theme === 'light' || p.theme === 'dark' || p.theme === 'system')) theme = p.theme;
          } else if (localStorage.getItem('darkMode') === 'enabled') {
            theme = 'dark';
          } else if (localStorage.getItem('darkMode') === 'disabled') {
            theme = 'light';
          }
        } catch (e) {}
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <style>
      .boot{min-height:100vh;min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:10px;background:#f6f2e9;color:#16211d;font:600 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.02em}
      [data-theme=dark] .boot{background:#0f1613;color:#ece6d8}
      .boot p{margin:0}
    </style>
  </head>
  <body>
    <noscript>
      <p style="margin:0;padding:10px 16px;background:#f4e8cc;color:#16211d;font:600 14px/1.5 system-ui,sans-serif;text-align:center">
        Aktifkan JavaScript agar iMuslim dapat memuat ayat, jadwal sholat, doa, dan hadits.
      </p>
    </noscript>
    <div id="root"><!--app-html-->
      <!-- Kerangka ringan untuk halaman yang tidak diprerender (404, alamat lama, mode dev). -->
      <div class="boot">
        <img src="%BASE_URL%favicon.svg" width="56" height="56" alt="" />
        <p>iMuslim</p>
      </div>
    <!--/app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
